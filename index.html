<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SLIME · Coming Soon</title>
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/BNBFanToken/slim/main/sprites/SlimeSmallA.png">
<link rel="apple-touch-icon" href="https://raw.githubusercontent.com/BNBFanToken/slim/main/sprites/SlimeSmallA.png">
<meta name="description" content="SLIME — on-chain slime pets. Coming soon.">
<meta name="theme-color" content="#f6f9f3">
<style>
:root{
  --bg:#f6f9f3;--surface:#ffffff;--surface2:#f2f6ee;
  --ink:#1a2e1c;--dim:#5f7263;--line:#e3ead9;
  --green:#3fa34d;--green-d:#2e8b3d;
  --gold:#8a6200;--gold-bg:#fbf3d9;
  --r1:#eef1ee;--r1t:#66706a;--r2:#e0f3dd;--r2t:#2e8b3d;
  --r3:#e3ecfd;--r3t:#3a5cc8;--r4:#fdf0d9;--r4t:#b07813;--r5:#fbe3f0;--r5t:#c2417f;
  --radius-l:16px;--radius-m:12px;--radius-s:9px;
  --shadow:0 1px 2px rgba(26,46,28,.04),0 10px 30px -14px rgba(26,46,28,.2);
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:linear-gradient(180deg,#f9fcf5 0%,var(--bg) 320px);
  color:var(--ink);line-height:1.6;font-size:15px;
  font-family:"MiSans","HarmonyOS Sans SC",-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.wrap{max-width:920px;margin:auto;padding:0 20px}

/* ===== 顶栏 ===== */
header{position:sticky;top:0;z-index:20;background:rgba(246,249,243,.92);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;gap:12px;padding:12px 0}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:.6px}
.logo canvas{image-rendering:pixelated;width:30px;height:30px;border-radius:var(--radius-s);background:#e0f0dc;padding:3px}
.badge{font-size:12px;font-weight:600;color:var(--gold);padding:4px 12px;border:1px solid #ecd9a4;
  border-radius:999px;background:var(--gold-bg);white-space:nowrap}
.badge .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#d9a53c;
  margin-right:7px;vertical-align:1px;box-shadow:0 0 0 3px rgba(217,165,60,.22);
  animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.4}}
.spacer{flex:1}
.lang{font:inherit;font-size:12.5px;font-weight:600;color:var(--dim);padding:0 14px;height:32px;
  border:1px solid var(--line);border-radius:999px;background:var(--surface);white-space:nowrap}
.lang:hover{border-color:#b9d8ba;background:#fbfdf9}

/* ===== Hero ===== */
.hero{padding:56px 0 20px;text-align:center}
.hero .stage{background:var(--surface);border:1px solid var(--line);border-radius:28px;
  padding:30px 20px 26px;box-shadow:var(--shadow);
  background-image:radial-gradient(circle at 50% 30%,#ffffff,#f0f7ec 90%)}
.hero canvas.big{image-rendering:pixelated;width:112px;height:112px;display:block;margin:0 auto 6px}
.hero h1{margin:6px 0 4px;font-size:34px;font-weight:800;letter-spacing:-.5px}
.hero .soon{display:inline-block;font-family:var(--mono);letter-spacing:3px;font-weight:700;
  background:linear-gradient(135deg,#46b354,#2e8b3d);color:#fff;border-radius:999px;
  padding:7px 22px;font-size:15px;box-shadow:0 6px 16px -6px rgba(46,139,61,.5);margin-bottom:12px}
.hero p.sub{color:var(--dim);font-size:14.5px;margin:0 auto;max-width:520px}
.hero .slimes{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:18px}
.hero .slimes canvas{image-rendering:pixelated;width:44px;height:44px;cursor:pointer;
  background:radial-gradient(circle at 50% 40%,#e9f4e4,#f4f8f0 72%);border-radius:12px;padding:6px;
  transition:.15s}
.hero .slimes canvas:hover{transform:translateY(-3px) scale(1.06)}
.tip{font-size:12.5px;color:#a9b6a7;margin-top:12px}

/* ===== 区块 ===== */
section{padding:34px 0 6px}
.sec-head h2{font-size:20px;margin:0 0 4px;font-weight:800;letter-spacing:-.2px}
.sec-head p{color:var(--dim);font-size:13.5px;margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-l);
  padding:22px;box-shadow:var(--shadow);margin-top:16px}

/* 玩法预告 */
.feats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.feat{background:var(--surface2);border:1px solid #ebf1e4;border-radius:var(--radius-m);padding:18px}
.feat .fk{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:6px}
.feat .fk .ico{width:26px;height:26px;border-radius:8px;background:#e0f0dc;
  display:inline-flex;align-items:center;justify-content:center;font-size:14px}
.feat p{margin:0;font-size:13px;color:var(--dim);line-height:1.7}
.feat .lock{font-size:11px;color:#a9b6a7;font-weight:600}

/* 宠物卡片 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(102px,1fr));gap:12px}
.pet{background:var(--surface2);border:1px solid #ebf1e4;border-radius:14px;text-align:center;
  padding:12px 6px 10px;position:relative;transition:.15s}
.pet:hover{background:#eaf3e6;transform:translateY(-2px)}
.pet .mob{border:none;background:radial-gradient(circle at 50% 40%,#e9f4e4,#f4f8f0 72%);
  padding:12px;display:block;margin:auto;cursor:pointer;border-radius:18px;height:auto}
.pet .mob:hover{background:radial-gradient(circle at 50% 40%,#e2f0db,#eef5ea 72%)}
.pet canvas{image-rendering:pixelated;width:56px;height:56px;display:block}
.pet .gif{image-rendering:pixelated;width:56px;height:56px;display:block;margin:auto}
.pet .nm{font-size:12.5px;margin-top:8px;font-weight:700}
.rarity{display:inline-block;font-size:11px;padding:2px 9px;border-radius:999px;margin-top:5px;font-weight:600}
.r1{background:var(--r1);color:var(--r1t)}.r2{background:var(--r2);color:var(--r2t)}
.r3{background:var(--r3);color:var(--r3t)}.r4{background:var(--r4);color:var(--r4t)}
.r5{background:var(--r5);color:var(--r5t)}

/* 概率 pills */
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.pill{display:inline-block;background:var(--gold-bg);color:var(--gold);border-radius:var(--radius-s);
  padding:3px 11px;font-size:12px;font-weight:600}

/* 进化路线 */
.path{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.path i{font-style:normal;background:var(--surface2);border-radius:var(--radius-s);padding:3px 10px;
  font-size:12px;color:var(--ink);white-space:nowrap;font-weight:500}
.path i.final{background:#fbe3f0;color:#c2417f;font-weight:700}
.note{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:18px;
  font-size:12.5px;color:var(--dim);line-height:1.8}

/* 页脚 */
footer{text-align:center;padding:36px 0 44px;color:#a9b6a7;font-size:12px}

@media(max-width:600px){
  .wrap{padding:0 14px}
  .card{padding:18px;border-radius:16px}
  .hero{padding:36px 0 10px}
  .hero h1{font-size:27px}
  .hero canvas.big{width:88px;height:88px}
  .pet canvas{width:48px;height:48px}
  .logo{font-size:16px}
  .hbar{padding:10px 0;gap:8px}
  .feat{padding:14px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><div class="wrap hbar">
  <div class="logo"><canvas id="logoCv" width="16" height="16"></canvas><span>SLIME</span></div>
  <span class="spacer"></span>
  <span class="badge"><span class="dot"></span><span data-i18n="badge">Coming Soon</span></span>
  <button class="lang" id="btnLang">中文</button>
</div></header>

<div class="wrap">

  <!-- ===== 首屏预告 ===== -->
  <div class="hero">
    <div class="stage">
      <canvas class="big" id="heroCv" width="16" height="16"></canvas>
      <h1 data-i18n="heroTitle">SLIME · Slime Pet Paradise</h1>
      <span class="soon">COMING SOON</span>
      <p class="sub" data-i18n="heroSub">On-chain slime pets. Launching soon.</p>
    </div>
  </div>

  <!-- ===== 图鉴预览 ===== -->
  <section>
    <div class="sec-head"><h2 data-i18n="bookTitle">Meet the Slimes</h2>
      <p data-i18n="bookSub">A first look at the crew — more to discover at launch.</p></div>
    <div class="grid" id="book"></div>
  </section>

  <footer>SLIME · Coming Soon</footer>
</div>

<script>
/* ============ 素材与动画(与原版同一套精灵 / 动画数据) ============ */
const SPR='https://raw.githubusercontent.com/BNBFanToken/slim/main/';
const PETS=[
  {type:1,file:'sprites/SlimeSquareSmallerA.png',name:'微尘史莱姆',nameEn:'Dust Slime',grade:'r1',label:'普通',labelEn:'Common',group:'SlimeSquare',frames:5},
  {type:2,file:'sprites/SlimeSquareSmallA.png',name:'砂砾史莱姆',nameEn:'Gravel Slime',grade:'r2',label:'稀有',labelEn:'Rare',group:'SlimeSquare',frames:5},
  {type:3,file:'sprites/SlimeSquareA.png',name:'方块史莱姆',nameEn:'Block Slime',grade:'r3',label:'史诗',labelEn:'Epic',group:'SlimeSquare',frames:5},
  {type:4,file:'sprites/SlimeSmallerA.png',name:'粉迷你史莱姆',nameEn:'Pink Mini Slime',grade:'r4',label:'传说',labelEn:'Legendary',group:'SlimeSmaller',frames:14},
  {type:5,file:'sprites/SlimeSmallA.png',name:'紫史莱姆',nameEn:'Purple Slime',grade:'r5',label:'神话',labelEn:'Mythic',group:'SlimeSmall',frames:15},
  {type:6,file:'sprites/SlimeP.png',name:'白史莱姆',nameEn:'White Slime',grade:'r5',label:'稀有形态',labelEn:'Rare Form',group:'Slime',frames:16},
  {type:7,file:'sprites/SlimeC.png',name:'蓝史莱姆',nameEn:'Blue Slime',grade:'r5',label:'稀有形态',labelEn:'Rare Form',group:'Slime',frames:16},
  {type:8,file:'sprites/SlimeA.png',name:'金史莱姆',nameEn:'Gold Slime',grade:'r5',label:'稀有形态',labelEn:'Rare Form',group:'Slime',frames:16},
  {type:9,file:'sprites/SlimeB.png',name:'血史莱姆',nameEn:'Blood Slime',grade:'r5',label:'稀有形态',labelEn:'Rare Form',group:'Slime',frames:16},
  {type:10,file:'sprites/slimPro.gif',name:'创世史莱姆',nameEn:'Genesis Slime',grade:'r5',label:'限定形态',labelEn:'Limited Form',group:null,frames:0}
];
const ANIM={
Slime:{Attack:{d:0.625,t:[0,.0625,.125,.1875,.25,.3125,.375,.4375,.5,.5625],f:[2,7,8,9,10,11,12,13,14,8],cue:[['audio/Bite.wav',0.1875]]},
Idle0:{d:1.5,loop:1,t:[0,.25,.5,.75,1,1.25],f:[2,1,2,1,2,1],cue:[]},
Idle1:{d:2,loop:1,t:[0,.875,1,1.125,1.25],f:[2,0,2,0,2],cue:[]},
Idle2:{d:3.125,loop:1,t:[0,.25,.375,.875,1.125,1.25,1.375,1.5,1.625,1.75,1.875],f:[2,0,2,1,2,1,2,1,2,1,2],cue:[]},
Walk:{d:0.625,t:[0,.0625,.125,.1875,.25,.3125,.4375,.5,.5625],f:[2,1,2,3,4,5,6,7,8],cue:[['audio/167075__drminky__slime-land.wav',0.4375]]}},
SlimeSmall:{Attack:{d:0.6875,t:[0,.0625,.125,.1875,.25,.3125,.375,.4375,.5,.5625,.625],f:[1,0,1,2,10,11,12,13,14,0,1],cue:[['audio/Bite.wav',0.25]]},
Idle0:{d:1.5,loop:1,t:[0,.125,.25,.375,.5,.625,.75,.875,1,1.125,1.25,1.375],f:[1,0,1,2,1,0,1,2,1,0,1,2],cue:[]},
Idle1:{d:2,loop:1,t:[0,1,1.125],f:[1,0,2],cue:[]},
Idle2:{d:2.625,loop:1,t:[0,1,1.125,2.375,2.5],f:[1,0,8,0,1],cue:[]},
Walk:{d:0.8125,t:[0,.0625,.125,.1875,.25,.3125,.375,.5,.5625,.625,.6875,.75],f:[1,0,1,2,3,4,5,6,7,8,0,1],cue:[['audio/167075__drminky__slime-land.wav',0.5625]]}},
SlimeSmaller:{Attack:{d:0.8125,t:[0,.0625,.125,.1875,.25,.3125,.375,.4375,.5,.5625,.625,.6875,.75],f:[1,0,1,2,6,7,8,9,10,11,12,13,1],cue:[['audio/Bite.wav',0.375]]},
Idle0:{d:1.5,loop:1,t:[0,.125,.25,.375,.5,.625,.75,.875,1,1.125,1.25,1.375],f:[1,0,1,2,1,0,1,2,1,0,1,2],cue:[]},
Idle1:{d:2,loop:1,t:[0,1,1.125],f:[1,0,2],cue:[]},
Idle2:{d:2.5,loop:1,t:[0,1,2.375],f:[1,0,1],cue:[]},
Walk:{d:0.75,t:[0,.0625,.125,.1875,.25,.3125,.4375,.5,.5625,.625,.6875],f:[1,0,1,2,3,4,5,2,1,0,1],cue:[['audio/167075__drminky__slime-land.wav',0.5]]}},
SlimeSquare:{Attack:{d:0.5,t:[0,.0625,.125,.1875,.3125,.375,.4375],f:[1,0,1,2,1,0,1],cue:[['audio/Bite.wav',0.1875]]},
Idle0:{d:1.5,loop:1,t:[0,.25,.5,.75,1,1.25],f:[1,0,1,0,1,0],cue:[]},
Idle1:{d:1.5,loop:1,t:[0],f:[1],cue:[]},
Idle2:{d:1.5,loop:1,t:[0],f:[0],cue:[]},
Walk:{d:0.5,t:[0,.0625,.125,.1875,.3125,.375,.4375],f:[1,0,1,2,1,0,1],cue:[['audio/167075__drminky__slime-land.wav',0.3125]]}}};

const mobs=[];
function pickIdle(){const n=Math.random()*121;return n<100?'Idle0':n<120?'Idle1':'Idle2'}
function playCue(file){try{const a=new Audio(SPR+file);a.playbackRate=1/1.5+Math.random();a.preservesPitch=false;a.volume=.5;a.play().catch(()=>{})}catch(e){}}
function makeMob(pet,canvas,calm){
  const image=new Image();image.src=SPR+pet.file;
  const m={pet,image,ctx:canvas.getContext('2d'),action:calm?'Idle0':pickIdle(),t:0,cues:new Set()};
  m.ctx.imageSmoothingEnabled=false;mobs.push(m);
  canvas.addEventListener('click',()=>{
    m.action=Math.random()<.5?'Walk':'Attack';m.t=0;m.cues.clear();
  });
  return m;
}
let last=performance.now();
function tick(now){
  const dt=Math.min((now-last)/1000,.05);last=now;
  for(const m of mobs){
    const g=ANIM[m.pet.group];let a=g[m.action];
    m.t+=dt;
    for(let i=0;i<a.cue.length;i++){if(m.t>=a.cue[i][1]&&!m.cues.has(i)){m.cues.add(i);playCue(a.cue[i][0])}}
    if(m.t>=a.d){m.action=pickIdle();m.t=0;m.cues.clear();a=g[m.action]}
    let idx=0;for(let i=0;i<a.t.length;i++)if(m.t>=a.t[i])idx=i;
    const f=a.f[idx],c=m.ctx;c.clearRect(0,0,16,16);
    if(m.image.complete&&m.image.naturalWidth)c.drawImage(m.image,f*16,0,16,16,0,0,16,16);
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
function petCard(pet,where){
  const el=document.createElement('div');el.className='pet';
  el.innerHTML=`<button class="mob" aria-label="${pname(pet)}">${pet.group?`<canvas width="16" height="16"></canvas>`:`<img class="gif" src="${SPR}${pet.file}" alt="${pname(pet)}">`}</button>
   <div class="nm">${pname(pet)}</div>
   <div class="rarity ${pet.grade}">${plabel(pet)}</div>`;
  where.appendChild(el);
  if(pet.group)makeMob(pet,el.querySelector('canvas'));
  return el;
}

/* logo / hero / 图鉴 */
makeMob(PETS[4],document.getElementById('logoCv'));
makeMob(PETS[5],document.getElementById('heroCv'),true);

/* ============ 语言切换(默认英文,可切中文) ============ */
const I18N={
  en:{title:'SLIME · Coming Soon',desc:'SLIME — on-chain slime pets. Coming soon.',
      badge:'Coming Soon',heroTitle:'SLIME · Slime Pet Paradise',
      heroSub:'On-chain slime pets. Launching soon.',
      bookTitle:'Meet the Slimes',bookSub:'A first look at the crew — more to discover at launch.',btn:'中文'},
  zh:{title:'SLIME · 即将开放',desc:'链上史莱姆宠物，即将上线。',
      badge:'即将开放',heroTitle:'SLIME · 史莱姆宠物乐园',
      heroSub:'链上史莱姆宠物乐园，即将上线。',
      bookTitle:'图鉴预览',bookSub:'先来认识一下它们，更多惊喜开放后揭晓。',btn:'English'}
};
let lang='en';
const pname=p=>lang==='zh'?p.name:p.nameEn;
const plabel=p=>lang==='zh'?p.label:p.labelEn;
function renderBook(){
  for(let i=mobs.length-1;i>=0;i--)if(!mobs[i].ctx.canvas.isConnected)mobs.splice(i,1);
  const grid=document.getElementById('book');grid.innerHTML='';
  PETS.forEach(p=>petCard(p,grid));
}
function applyLang(l){
  lang=l;const t=I18N[l];
  document.documentElement.lang=l==='zh'?'zh-CN':'en';
  document.title=t.title;
  document.querySelector('meta[name=description]').content=t.desc;
  document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=t[el.dataset.i18n]});
  document.getElementById('btnLang').textContent=t.btn;
  renderBook();
}
document.getElementById('btnLang').onclick=()=>applyLang(lang==='en'?'zh':'en');
applyLang('en');
</script>
</body>
</html>
